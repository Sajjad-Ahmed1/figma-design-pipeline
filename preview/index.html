<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Pipeline — Token Preview</title>
<!-- Generated by the pipeline. Nothing below hardcodes a color, space or radius. -->
<link rel="stylesheet" href="../build/css/tokens.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.7 Inter, system-ui, sans-serif;
    background: var(--color-surface-subtle); color: var(--color-text-primary);
    padding: var(--spacing-xl);
  }
  .board { max-width: 640px; display: grid; gap: var(--spacing-lg); }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; }
  .muted { opacity: 0.7; margin: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: var(--spacing-md); }
  .swatch { display: grid; gap: var(--spacing-sm); font-size: 12px; }
  .chip { width: 96px; height: 64px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }
  .card {
    width: 360px; display: grid; gap: var(--spacing-md); justify-items: start;
    background: var(--color-surface-default); padding: var(--spacing-lg);
    border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgb(18 18 26 / 0.08);
  }
  .card h2 { margin: 0; font-size: 20px; }
  .button {
    border: 0; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer;
    background: var(--color-brand-primary); color: var(--color-text-on-primary);
    padding: var(--spacing-sm) var(--spacing-md); border-radius: var(--radius-md);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .button:hover { transform: scale(1.03); filter: brightness(1.1); }
  .button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <main class="board">
    <h1>Figma Design Pipeline</h1>
    <p class="muted">This page is styled only by <code>build/css/tokens.css</code>, generated from Figma variables.</p>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:var(--color-brand-primary)"></div>brand/primary</div>
      <div class="swatch"><div class="chip" style="background:var(--color-brand-secondary)"></div>brand/secondary</div>
      <div class="swatch"><div class="chip" style="background:var(--color-neutral-900)"></div>neutral/900</div>
      <div class="swatch"><div class="chip" style="background:var(--color-neutral-100)"></div>neutral/100</div>
      <div class="swatch"><div class="chip" style="background:var(--color-feedback-danger)"></div>feedback/danger</div>
    </div>
    <section class="card">
      <h2>Design tokens, shipped</h2>
      <p class="muted">Every color, space and radius here is a Figma variable. Edit one and sync.</p>
      <button class="button">Get started</button>
    </section>
  </main>
</body>
</html>
